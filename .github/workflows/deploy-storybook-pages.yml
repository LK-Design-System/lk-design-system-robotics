name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare LDS Product Storybook compatibility surface
        run: node scripts/prepare-pages-lds-product-storybook.mjs

      - name: Verify packaged AI and adoption documentation
        run: npm run check:docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build robotics package
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Verify public AI and adoption documentation
        run: npm run check:storybook-docs

      - name: Include third-party notices
        run: |
          mkdir -p storybook-static/licenses
          cp THIRD_PARTY_NOTICES.md storybook-static/THIRD_PARTY_NOTICES.md
          cp licenses/Apache-2.0.txt storybook-static/licenses/Apache-2.0.txt
          cp licenses/MIT-WDS.txt storybook-static/licenses/MIT-WDS.txt
          cp licenses/PRETENDARD-OFL-1.1.txt storybook-static/licenses/PRETENDARD-OFL-1.1.txt
          cp node_modules/@lk-design-system/lds-core/THIRD_PARTY_NOTICES.md storybook-static/licenses/lds-core-THIRD_PARTY_NOTICES.md
          cp node_modules/@lk-design-system/lds-product/THIRD_PARTY_NOTICES.md storybook-static/licenses/lds-product-THIRD_PARTY_NOTICES.md
          cp node_modules/@lk-design-system/lds-theme/THIRD_PARTY_NOTICES.md storybook-static/licenses/lds-theme-THIRD_PARTY_NOTICES.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
