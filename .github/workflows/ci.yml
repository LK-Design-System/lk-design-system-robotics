name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baseline:
        description: Regenerate and upload Ubuntu visual baselines
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      # The conformance CLI, the upstream token manifest AND the cross-repository
      # style contract all live in lk-design-system, so this pin decides which
      # manifest *and which dependency versions* Robotics is checked against.
      # Both halves bite: 570774d1 replaced 2df13b68 because that pin still
      # required lds-core/product/theme at 0.1.0-rc.1 while Robotics had moved to
      # rc.3, so DEPENDENCY_VERSION failed before npm ci ever ran. A release that
      # bumps the dependency pins is therefore also a pin advance here. e37372d2 was 20 commits stale and predated the token additions
      # Robotics already ships, so every run failed here - before npm ci, before
      # npm run check, before check:storybook - reporting --space-1-5, --radius-4,
      # --color-semantic-data-viz-series-5 and the --component-viewer-*map tokens as
      # undefined even though the current manifest lists all of them. Advancing the
      # pin has to happen in the same change as any Robotics token-usage change.
      - name: Run pinned LDS conformance
        id: lds_conformance
        uses: LK-Design-System/lk-design-system/.github/actions/lds-conformance@570774d1bd23c3bcfaf3d546b11ddfe2203a0d81
        with:
          profile: robotics-ui
          root: .
      - name: Export pinned LDS conformance paths
        shell: pwsh
        env:
          CONFORMANCE_CLI: ${{ steps.lds_conformance.outputs.cli }}
          CONFORMANCE_ROOT: ${{ steps.lds_conformance.outputs.lds_root }}
        run: |
          "LDS_CONFORMANCE_CLI=$env:CONFORMANCE_CLI" >> $env:GITHUB_ENV
          "LDS_CONFORMANCE_ROOT=$env:CONFORMANCE_ROOT" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Check Storybook contracts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_visual_baseline != true }}
        run: npm run check:storybook

      # Advisory, not blocking, while the design is still moving. Pixel baselines go
      # red on every intentional visual change, and each one needs a human to look
      # and re-approve - during active design work that is mostly noise, and a
      # permanently red CI just trains everyone to ignore CI. The blocking gate is
      # check:story-play above: those 109 assertions are contracts (a label must
      # render, nothing may overflow at 320px, Lane keeps its 4 6 dash) so they
      # survive recolouring and respacing and only fire when something actually
      # breaks. Make this blocking again once the design settles.
      - name: Visual regression (advisory)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_visual_baseline != true }}
        continue-on-error: true
        run: npm run check:visual-regression
      - name: Generate Ubuntu visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baseline == true }}
        run: npm run update:visual-baseline
      - name: Upload Ubuntu visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baseline == true }}
        uses: actions/upload-artifact@v4
        with:
          name: robotics-linux-visual-baselines
          path: visual-baselines/smoke-linux
          if-no-files-found: error
